name: Build Travel 24x7 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          unzip -oq "$ZIP_FILE" -d extracted
          echo "Extracted project files:"
          find extracted -maxdepth 4 -type f | head -80
          ANDROID_DIR=$(find extracted -type f -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR=$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)
          fi
          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found in ZIP"
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          chmod +x "$ANDROID_DIR/gradlew"
          "$ANDROID_DIR/gradlew" -p "$ANDROID_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Travel-24x7-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
